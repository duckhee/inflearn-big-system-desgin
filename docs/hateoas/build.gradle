/**
 * HATEOAS 마이그레이션 프로젝트 루트 빌드 설정
 * => 원본 루트 build.gradle 의 allprojects 설정과 동일하게 유지한다.
 *    (common 모듈들의 build.gradle 이 plugin / lombok 설정을 루트에서 상속받는 구조이기 때문)
 */
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.won'
version = '0.0.1-SNAPSHOT'

/** 모든 하위 프로젝트(common:*, service:*) 공통 설정 */
allprojects {

    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        implementation 'ch.qos.logback:logback-classic'
        // elasticsearch 에 log 저장을 하기 위한 logstash 및 log 설정
        implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
