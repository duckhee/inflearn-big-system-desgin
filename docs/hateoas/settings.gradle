/**
 * HATEOAS 마이그레이션 프로젝트 (독립 Gradle 빌드)
 *
 * - 루트 프로젝트(inflearn-big-system-design)의 settings.gradle 에는 포함되지 않는 "별도 빌드" 이다.
 *   => 기존 프로젝트 빌드/실행에 전혀 영향을 주지 않는다.
 * - 공통 모듈(common:*)은 복사하지 않고, 원본 디렉토리를 projectDir 로 직접 참조한다.
 *   => 공통 코드 중복을 막고, 원본 공통 모듈이 바뀌면 이 프로젝트에도 그대로 반영된다.
 * - HATEOAS 로 전환되는 서비스(service:article)만 이 폴더 안에 코드를 가진다.
 *
 * 빌드 방법 (루트 프로젝트 디렉토리에서):
 *   ./gradlew -p docs/hateoas :service:article:build
 */
rootProject.name = 'inflearn-big-system-design-hateoas'

/** 공통 모듈: 원본 프로젝트의 common 디렉토리를 그대로 사용 (프로젝트 경로 이름도 원본과 동일하게 유지) */
include 'common'
include 'common:snowflake', 'common:data-serializer', 'common:event', 'common:outbox-message-relay'
project(':common').projectDir = file('../../common')
project(':common:snowflake').projectDir = file('../../common/snowflake')
project(':common:data-serializer').projectDir = file('../../common/data-serializer')
project(':common:event').projectDir = file('../../common/event')
project(':common:outbox-message-relay').projectDir = file('../../common/outbox-message-relay')

/** HATEOAS 로 마이그레이션 된 서비스 */
include 'service'
include 'service:article'
